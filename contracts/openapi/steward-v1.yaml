openapi: 3.1.0
info:
  title: Steward public API
  version: 1.0.0
  summary: The /v1 REST surface of the Steward control plane (doc 10 §4).
  description: |
    JSON over HTTPS, snake_case keys, RFC 3339 timestamps, UUIDv7 ids. Unknown request keys are rejected
    with `invalid_request`. Every mutating POST carries `Idempotency-Key` (24 h replay window; replays carry
    `Idempotent-Replayed: true`). Every response carries `X-Request-Id`, `RateLimit-Limit`,
    `RateLimit-Remaining` and `RateLimit-Reset`. Changes to this document are additive within v1 (doc 10 §2).
  license:
    name: Proprietary
servers:
  - url: https://api.{region}.steward.dev/v1
    description: Control plane, per region.
    variables:
      region:
        default: eu-west-1
security:
  - apiKey: []
  - humanToken: []
tags:
  - name: auth
  - name: targets
  - name: branches
  - name: changesets
  - name: reviews
  - name: merges
  - name: policies
  - name: impact-queries
  - name: principals
  - name: audit
  - name: webhooks
  - name: data-planes

paths:
  # ---------------------------------------------------------------- auth
  /auth/tokens:
    post:
      tags: [auth]
      operationId: createHumanToken
      summary: Exchange an SSO session for a 1 h human API token (stwt_...).
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Token issued; shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanToken'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------- targets
  /targets:
    post:
      tags: [targets]
      operationId: createTarget
      summary: Register a target; the data plane runs describe() asynchronously (cap target:admin).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CreateTarget'
      responses:
        '201':
          description: Target registered with status `registering`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [targets]
      operationId: listTargets
      summary: List targets the caller holds any capability on.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of targets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    get:
      tags: [targets]
      operationId: getTarget
      summary: Get one target.
      responses:
        '200':
          description: The target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}/settings:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    patch:
      tags: [targets]
      operationId: patchTargetSettings
      summary: Partially update target settings (cap target:admin); retention and legal-hold changes propagate to the data plane.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetSettingsPatch'
      responses:
        '200':
          description: Updated target.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Target'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}/schema:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    get:
      tags: [targets]
      operationId: getTargetSchema
      summary: Cached TargetDescription from the adapter's describe() (schema metadata, never rows).
      responses:
        '200':
          description: Target description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TargetDescription'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}/queue:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    get:
      tags: [targets, reviews]
      operationId: getReviewQueue
      summary: Review queue entries for the target, oldest first, keyset (entered_at, id) (cap review:read).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of queue entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntryPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}/merges:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    get:
      tags: [merges]
      operationId: listTargetMerges
      summary: List merges on a target, newest first (cap changeset:read).
      parameters:
        - name: status
          in: query
          description: Filter by merge status.
          schema:
            $ref: '#/components/schemas/MergeStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of merges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergePage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}/policies:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    post:
      tags: [policies]
      operationId: createPolicy
      summary: Create a policy from YAML as version 1 in draft (cap policy:write).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/PolicyYaml'
      responses:
        '201':
          description: Policy created; `active_version` is null until a version is activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyWithVersion'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PolicyInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [policies]
      operationId: listTargetPolicies
      summary: List policies on a target (cap policy:read).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}/impact-queries:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    post:
      tags: [impact-queries]
      operationId: createImpactQuery
      summary: Add an impact query; static check requires a single SELECT (cap target:admin).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateImpactQuery'
      responses:
        '201':
          description: Impact query created; applies to changesets proposed after now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactQuery'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/PolicyInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [impact-queries]
      operationId: listImpactQueries
      summary: List impact queries on a target (cap policy:read).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of impact queries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactQueryPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}/memberships:
    parameters:
      - $ref: '#/components/parameters/TargetId'
    post:
      tags: [principals]
      operationId: createMembership
      summary: Grant a human membership capability on a target (cap target:admin).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Membership'
      responses:
        '201':
          description: Membership granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipRecord'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [principals]
      operationId: listMemberships
      summary: List memberships on a target (cap target:admin).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of memberships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /targets/{target_id}/memberships/{principal_id}/{capability}:
    parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/PrincipalId'
      - name: capability
        in: path
        required: true
        description: Membership capability to revoke.
        schema:
          $ref: '#/components/schemas/MembershipCapability'
    delete:
      tags: [principals]
      operationId: deleteMembership
      summary: Revoke one membership capability (cap target:admin); idempotent.
      responses:
        '204':
          description: Revoked (or already absent).
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------- branches
  /branches:
    post:
      tags: [branches]
      operationId: createBranch
      summary: Create a branch ([*] → open); returns the proxy connection string (cap branch:write).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranch'
      responses:
        '201':
          description: Branch open; `connection_string` is returned only here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBranchResponse'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
    get:
      tags: [branches]
      operationId: listBranches
      summary: List branches (cap changeset:read).
      parameters:
        - name: target_id
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: state
          in: query
          schema:
            $ref: '#/components/schemas/BranchState'
        - name: principal_id
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /branches/{branch_id}:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    get:
      tags: [branches]
      operationId: getBranch
      summary: Get a branch (cap changeset:read or owner).
      responses:
        '200':
          description: The branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /branches/{branch_id}/propose:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    post:
      tags: [branches]
      operationId: proposeBranch
      summary: Freeze writes and compute a changeset (open → proposed); always 202, poll the changeset (cap branch:propose, owner).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rationale'
      responses:
        '202':
          $ref: '#/components/responses/Proposed'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /branches/{branch_id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    post:
      tags: [branches]
      operationId: withdrawBranch
      summary: Withdraw a proposal (proposed → open, reason withdrawn); owner only.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Branch back in open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /branches/{branch_id}/abandon:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    post:
      tags: [branches]
      operationId: abandonBranch
      summary: Abandon a branch (open|proposed → abandoned, reason abandoned_by_principal); owner or target:admin.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Branch abandoned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /branches/{branch_id}/changesets:
    parameters:
      - $ref: '#/components/parameters/BranchId'
    get:
      tags: [changesets]
      operationId: listBranchChangesets
      summary: Changesets of a branch, newest first, superseded included (cap changeset:read).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of changesets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesetPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------- changesets
  /changesets/{changeset_id}:
    parameters:
      - $ref: '#/components/parameters/ChangesetId'
    get:
      tags: [changesets]
      operationId: getChangeset
      summary: Get a changeset; `summary.columns[].distinct_values` only for callers with review:read (cap changeset:read).
      responses:
        '200':
          description: The changeset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changeset'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /changesets/{changeset_id}/verdict:
    parameters:
      - $ref: '#/components/parameters/ChangesetId'
    get:
      tags: [changesets, policies]
      operationId: getChangesetVerdict
      summary: Get the verdict of an evaluated changeset (cap changeset:read).
      responses:
        '200':
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verdict'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /changesets/{changeset_id}/grants:
    parameters:
      - $ref: '#/components/parameters/ChangesetId'
    post:
      tags: [changesets]
      operationId: createGrant
      summary: Issue a 5-minute ES256 grant for the data plane's row-delta endpoints (cap review:read).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGrant'
      responses:
        '201':
          description: Grant issued; recorded as a `grant.issued` event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /changesets/{changeset_id}/reviews:
    parameters:
      - $ref: '#/components/parameters/ChangesetId'
    post:
      tags: [reviews]
      operationId: createReview
      summary: Record a review decision (cap review:decide, not the owning principal); drives proposed → merging|rejected|open.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReview'
      responses:
        '201':
          description: Review recorded (permanent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '501': { $ref: '#/components/responses/ReviewEditNotSupported' }
    get:
      tags: [reviews]
      operationId: listReviews
      summary: List review records of a changeset (cap review:read).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPage'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------- merges
  /merges:
    get:
      tags: [merges]
      operationId: listMerges
      summary: List merges, filterable by changeset (cap changeset:read).
      parameters:
        - name: changeset_id
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/MergeStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of merges.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergePage'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /merges/{merge_id}:
    parameters:
      - $ref: '#/components/parameters/MergeId'
    get:
      tags: [merges]
      operationId: getMerge
      summary: Get a merge with progress and compensation status (cap changeset:read).
      responses:
        '200':
          description: The merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merge'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /merges/{merge_id}/revert:
    parameters:
      - $ref: '#/components/parameters/MergeId'
    post:
      tags: [merges]
      operationId: revertMerge
